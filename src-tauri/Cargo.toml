[package]
name = "wechat-devify-bridge"
version = "0.1.9"
description = "Manually review and forward selected chat text to a self-hosted Devify inbox"
authors = ["You"]
edition = "2021"
default-run = "wechat-devify-bridge"

[lib]
name = "wechat_devify_bridge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The app crate must expose only its own binary. Tauri bundles every bin target in
# `src/bin` as an auxiliary executable inside the app bundle, so the read-only CLI
# and the debug tools are opt-in here. They are built before bundling and shipped
# as plain resources (see `bundle.resources` in tauri.conf.json).
[features]
aux-binaries = []

[[bin]]
name = "wxq"
path = "src/bin/wxq.rs"
required-features = ["aux-binaries"]

[[bin]]
name = "wechat-key-scan"
path = "src/bin/wechat-key-scan.rs"
required-features = ["aux-binaries"]

[[bin]]
name = "wechat-mcp-sse"
path = "src/bin/wechat-mcp-sse.rs"
required-features = ["aux-binaries"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
iana-time-zone = "0.1"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
hmac = "0.12"
sha2 = "0.10"
pbkdf2 = "0.12"
hex = "0.4"
md-5 = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
zstd = "0.13"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tokio = { version = "1", features = ["net", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
tempfile = "3"
getrandom = "0.2"
hostname = "0.4"
base64 = "0.22"
url = "2"
tauri-plugin-deep-link = "2"
zip = "2"
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2.4.0"

[target.'cfg(target_os = "macos")'.dependencies]
mach2 = "0.4"

# Local database decryption is CPU-bound (AES + HMAC per 4 KiB page). Optimizing only the
# dependencies keeps debug builds usable without giving up debug info for this crate.
[profile.dev.package."*"]
opt-level = 2
