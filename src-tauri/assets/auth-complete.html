<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>AImyChats — Login complete</title>
<style>
  /* Mirrors the AImyChats web app tokens (ui/src/assets/css/tokens.css) so the
     browser tab that finishes the desktop sign-in looks like the login page
     the user just left. Single file: the loopback listener answers one
     request, so every asset is inlined. */
  :root {
    --bg: #f7f8fa;
    --panel: #ffffff;
    --line: #e3e7ed;
    --ink: #0f1729;
    --ink-2: #5a6474;
    --ok: #17825a;
    --ok-soft: #e7f4ee;
    --shadow: 0 12px 32px rgba(15, 23, 41, 0.07), 0 1px 2px rgba(15, 23, 41, 0.05);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1116;
      --panel: #131820;
      --line: #232a33;
      --ink: #e6eaf0;
      --ink-2: #98a2b3;
      --ok: #3fb984;
      --ok-soft: #14302a;
      --shadow: 0 12px 32px rgba(0, 0, 0, 0.45), 0 1px 2px rgba(0, 0, 0, 0.3);
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; }

  html { height: 100%; }

  body {
    min-height: 100%;
    margin: 0;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 24px;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue",
      "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 14px;
    line-height: 1.5;
    letter-spacing: -0.003em;
    -webkit-font-smoothing: antialiased;
  }

  .card {
    /* auto margins centre the card and still keep its top reachable when the
       window is shorter than the card */
    margin: auto;
    width: 100%;
    max-width: 420px;
    padding: 32px 34px 30px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    box-shadow: var(--shadow);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 9px;
    margin-bottom: 26px;
  }
  .brand img {
    display: block;
    width: 24px;
    height: 24px;
    border-radius: 7px;
  }
  .brand span {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  .mark {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    margin-bottom: 18px;
    border-radius: 50%;
    background: var(--ok-soft);
    color: var(--ok);
  }
  .mark svg {
    width: 22px;
    height: 22px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2.2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  h1 {
    margin: 0 0 8px;
    font-size: 18px;
    font-weight: 600;
    line-height: 1.4;
    letter-spacing: -0.012em;
  }

  .message {
    margin: 0;
    color: var(--ink-2);
    font-size: 13.5px;
    line-height: 1.65;
  }
</style>
</head>
